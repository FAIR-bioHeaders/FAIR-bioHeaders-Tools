language = "C"
include_guard = "FHCORE_H"
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c"
style = "type"
usize_is_size_t = true
header = """/* fhcore.h: C ABI of the FAIR-bioHeaders engine (libfhcore), ABI 0.1.
 * Generated by cbindgen from crates/fair-bioheaders-tools-capi; do not edit.
 * Rules (Tools#207 section 3): explicit byte lengths (outputs carry an extra
 * trailing NUL that is not counted); outputs are borrowed from the handle that
 * produced them until its release function runs; every release function accepts
 * NULL; a verdict is FH_OK with a result; no thread-local error state.
 *
 * SPDX-License-Identifier: MPL-2.0 */"""

[defines]
"feature = fault-injection" = "FH_FAULT_INJECTION"

[export]
include = ["fh_options", "fh_engine", "fh_stream", "fh_result", "fh_value", "fh_error"]

[parse]
parse_deps = false
