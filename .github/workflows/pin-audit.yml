name: Pin audit (advisory)

# FAIR-bioHeaders-Specification#241: compare every cross-repo contract reference
# this repository holds — released contracts at a tag, the FHT draft contract at a
# commit, the FHT conformance suite at its own commit, and any base/carrier pin —
# with the authoritative bytes at the revision each reference names.
#
# Advisory by design. A drift is a finding for whoever owns the pin, and re-pinning
# is a deliberate, dated commit in this repository: a scheduled job must not be able
# to redden main because upstream moved, and it must never rewrite a pin itself.
# The command exits 0 whatever it reports unless --exit-on-drift is passed (it is
# not here), so findings never fail this job. A crash of the audit itself exits 2
# and does fail it: an audit that did not run must not look like a clean one.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, off the hour
  workflow_dispatch:
  pull_request:
    paths:
      - 'bioheaders/pins.json'
      - 'bioheaders/pin_audit.py'
      - 'bioheaders/pin_currency.py'
      - 'bioheaders/schemas/bundled.json'
      - 'tests/pin_audit_test.py'
      - 'tests/pin_currency_test.py'
      - '.github/workflows/pin-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install this checkout
        run: python -m pip install --quiet .
      - name: Audit every recorded reference against its named revision
        run: |
          # Probe once; render both forms from the same captured snapshots.
          status=0
          bioheaders-pin-audit --against-default --consumers --json > "$RUNNER_TEMP/pin-audit.json" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::bioheaders-pin-audit crashed (exit $status); see the traceback above"
            exit "$status"
          fi
          python - "$RUNNER_TEMP/pin-audit.json" > "$RUNNER_TEMP/pin-audit.txt" <<'PY'
          import json
          import sys
          from bioheaders.pin_audit import format_text, load_table
          from bioheaders.pin_currency import format_extra
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          print(format_text(load_table(), report["references"], report["conflict_markers"], report["controls"]))
          print(format_extra(report["default_content"], report["consumers"], report["default_metadata_controls"]))
          PY
          cat "$RUNNER_TEMP/pin-audit.txt"
      - name: Publish both reports as the run artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin-audit
          path: ${{ runner.temp }}/pin-audit.*
          if-no-files-found: ignore
      - name: Non-gating note
        if: always()
        run: |
          {
            echo '## Pin audit is advisory'
            echo
            echo 'FRESH / DRIFT / ABSENT change no file and no pin. A DRIFT means a'
            echo 'record in `bioheaders/pins.json` no longer names the bytes at the'
            echo 'revision it cites. Default-content differences invalidate no historical'
            echo 'release pin. Consumer records are not native acceptance. No report'
            echo 'automatically refreshes a pin; changes require a deliberate dated commit'
            echo '(docs/PIN-AUDIT.md). Draft rows are `draft, not acceptance`.'
          } >> "$GITHUB_STEP_SUMMARY"
