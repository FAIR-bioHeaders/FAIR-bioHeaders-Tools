name: Nextflow workflow

# Runs the Dockstore-registered workflow in nextflow/workflows/fairbioheaders with
# -profile test,docker. The workflow uses the modules' containers (the BioContainers
# image of fair-bioheaders, which includes pyld from 0.8.2) and its conda profile pins
# the modules' Bioconda package; this job checks both, then runs the test samplesheet,
# whose jsonld row reads expanded JSON-LD metadata, which needs pyld.

on:
  push:
    branches: [main]
    paths:
      - 'nextflow/**'
      - '.dockstore.yml'
      - '.github/workflows/nextflow-workflow.yml'
  pull_request:
    paths:
      - 'nextflow/**'
      - '.dockstore.yml'
      - '.github/workflows/nextflow-workflow.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that the workflow uses the modules' containers and Bioconda pin
        run: |
          workflow=nextflow/workflows/fairbioheaders
          # No container override: both processes run the modules' BioContainers image.
          if grep -nE '^\s*container\s*=' "$workflow/nextflow.config"; then exit 1; fi
          version="$(sed -n 's/^ *- bioconda::fair-bioheaders=\([0-9.]*\)$/\1/p' "$workflow/environment.yml")"
          test -n "$version"
          for module in nextflow/modules/nf-core/fairbioheaders/*/; do
            grep -q "^ *- bioconda::fair-bioheaders=$version$" "$module/environment.yml"
            grep -q "quay.io/biocontainers/fair-bioheaders:$version--" "$module/main.nf"
          done
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: 26.04.6
      - name: Run the test profile
        run: |
          nextflow run nextflow/workflows/fairbioheaders/main.nf -profile test,docker --outdir results
          for id in fasta gfa gff3 jsonld; do
            grep -q '^Checksum verified\.$' "results/verify/$id.verify.txt"
          done
          ls -l results/combine results/verify
