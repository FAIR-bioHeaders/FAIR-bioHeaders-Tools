name: Nextflow workflow

# Runs the Dockstore-registered workflow in nextflow/workflows/fairbioheaders with
# -profile test,docker. nextflow.config points both processes at
# ghcr.io/fair-bioheaders/fair-bioheaders:X.Y.Z, which unlike the modules'
# BioContainers image of the same release has pyld (the jsonld extra); this job checks
# that the modules pin that release, builds the image from the release's wheel and the
# Dockerfile and tags it with that name, so Nextflow runs the local build instead of
# pulling it.

on:
  push:
    branches: [main]
    paths:
      - 'nextflow/**'
      - '.dockstore.yml'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/nextflow-workflow.yml'
  pull_request:
    paths:
      - 'nextflow/**'
      - '.dockstore.yml'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/nextflow-workflow.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the image the workflow names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="$(sed -n "s/^ *container *= *'\(ghcr\.io\/fair-bioheaders\/fair-bioheaders:[0-9.]*\)'$/\1/p" \
            nextflow/workflows/fairbioheaders/nextflow.config)"
          version="${image##*:}"
          test -n "$version"
          # The conda environment and the modules pin the same release as the image.
          grep -q "bioconda::fair-bioheaders=$version$" nextflow/workflows/fairbioheaders/environment.yml
          for module in nextflow/modules/nf-core/fairbioheaders/*/; do
            grep -q "bioconda::fair-bioheaders=$version$" "$module/environment.yml"
          done
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fair_bioheaders-*-py3-none-any.whl' --dir dist
          docker build --build-arg "VERSION=$version" --tag "$image" .
          test "$(docker run --rm "$image" bioheaders --version)" = "$version"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: 26.04.6
      - name: Run the test profile
        run: |
          nextflow run nextflow/workflows/fairbioheaders/main.nf -profile test,docker --outdir results
          for id in fasta gfa gff3; do
            grep -q '^Checksum verified\.$' "results/verify/$id.verify.txt"
          done
          ls -l results/combine results/verify
