name: Declared references (advisory)
on:
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'bioheaders/pins.json'
      - 'bioheaders/schemas/bundled.json'
      - 'references/**'
      - 'tests/fixtures/r4-crosswalk.json'
      - 'tests/fixtures/fht-microdata/**'
      - 'scripts/audit_declared_references.py'
      - '.github/workflows/declared-references.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: 6dee4c8baba723ec5cad825d521db2dbbc1921ae
          path: authority-checker
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Audit current declarations without repinning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_declared_references.py --checker-root authority-checker --report-output "$RUNNER_TEMP/tools-references.json"
