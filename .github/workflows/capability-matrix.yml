name: Capability matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    # One job, three gates, in the order that makes a failure readable: the
    # document must match a live render, the render's own probes must have run
    # against the released bytes at a tag, and the check must demonstrably fail on
    # a deliberate wrong claim. See docs/CAPABILITY-MATRIX.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
      - name: Check out the specification at the tag the toolkit bundles
        # The tag comes from bioheaders/schemas/bundled.json, not from a literal
        # here: the matrix reads released bytes, and a stale clone would make it
        # describe a release nobody named (FAIR-bioHeaders-Specification#241 rule 1).
        run: |
          TAG=$(python -c "import json;print(json.load(open('bioheaders/schemas/bundled.json'))['current']['release'])")
          echo "SPEC_TAG=$TAG" >> "$GITHUB_ENV"
          git clone --quiet --depth 1 --branch "$TAG" \
            https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification.git \
            "$RUNNER_TEMP/FAIR-bioHeaders-Specification"
      - name: The committed matrix matches a fresh render
        env:
          FHR_SPECIFICATION: ${{ runner.temp }}/FAIR-bioHeaders-Specification
        run: poetry run python scripts/render_capability_matrix.py --check
      - name: The check fails on deliberate wrong claims
        # docs/CAPABILITY-MATRIX.md and scripts/render_capability_matrix.py carry
        # the mutations; this proves in CI that a widened cell, a dropped row, a
        # false probe expectation and a release-shaped sentence about a draft all
        # go red, and that nothing was written.
        env:
          FHR_SPECIFICATION: ${{ runner.temp }}/FAIR-bioHeaders-Specification
        run: poetry run python scripts/render_capability_matrix.py --self-test
      - name: The matrix is byte-identical to what was committed
        run: |
          before=$(sha256sum docs/CAPABILITY-MATRIX.md | cut -d' ' -f1)
          git diff --exit-code -- docs/CAPABILITY-MATRIX.md scripts/render_capability_matrix.py
          after=$(sha256sum docs/CAPABILITY-MATRIX.md | cut -d' ' -f1)
          test "$before" = "$after"
          echo "docs/CAPABILITY-MATRIX.md unchanged: $after"
      - name: Every test the matrix cites still exists
        env:
          FHR_SPECIFICATION: ${{ runner.temp }}/FAIR-bioHeaders-Specification
        run: poetry run pytest tests/capability_matrix_test.py -q
      - name: Formatting and lint of the generator
        run: |
          poetry run ruff check scripts/render_capability_matrix.py tests/capability_matrix_test.py
          poetry run isort --check-only scripts/render_capability_matrix.py tests/capability_matrix_test.py
          poetry run black --check scripts/render_capability_matrix.py tests/capability_matrix_test.py
