name: Capability matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies and a non-editable copy of this checkout
        run: |
          python -m pip install poetry
          poetry install
          poetry run pip install --no-deps .
      - name: Read the bundled release tag
        id: release
        run: |
          python - <<'PY'
          import json, os, re
          tag = json.load(open('bioheaders/schemas/bundled.json'))['current']['release']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Check out the immutable shared suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: ${{ steps.release.outputs.tag }}
          path: .specification
          fetch-depth: 0 # Historical v0.6.0 ledger remains separately byte-pinned.
          persist-credentials: false
      - name: Check measured matrix and deliberate failure controls
        run: |
          sha256sum docs/CAPABILITY-MATRIX.md scripts/render_capability_matrix.py > "$RUNNER_TEMP/matrix-before.sha256"
          poetry run python scripts/render_capability_matrix.py --suite .specification/conformance --check --self-test
      - name: Independent published-grid digest, citation and live-render tests
        env:
          FHR_SPECIFICATION: ${{ github.workspace }}/.specification
        run: poetry run pytest tests/capability_matrix_test.py -q
      - name: Matrix checks wrote nothing
        run: |
          sha256sum --check "$RUNNER_TEMP/matrix-before.sha256"
          git diff --exit-code -- docs/CAPABILITY-MATRIX.md scripts/render_capability_matrix.py
      - name: Formatting and lint of the generator and independent tests
        run: |
          poetry run ruff check scripts/render_capability_matrix.py tests/capability_matrix_test.py
          poetry run isort --check-only scripts/render_capability_matrix.py tests/capability_matrix_test.py
          poetry run black --check scripts/render_capability_matrix.py tests/capability_matrix_test.py
      - name: Check out adopted current reader-policy corpus separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: 6dee4c8baba723ec5cad825d521db2dbbc1921ae
          path: .policy-specification
          fetch-depth: 0 # Released-vector retirement guard requires actual tag history.
          persist-credentials: false
      - name: Execute all shared vectors against installed commands
        # All six formats are mandatory here, including JSON-LD and microdata.
        # The four native libraries' 228/63 accounting is not this consumer's scope.
        run: |
          converter_bin="$(poetry run python -c 'import sys; from pathlib import Path; print(Path(sys.executable).parent)')"
          checker_python="$(poetry run python -c 'import sys; print(sys.executable)')"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$checker_python" "$GITHUB_WORKSPACE/.policy-specification/scripts/check_conformance.py" --skip-regeneration \
            --converter "$converter_bin" \
            --require-format fasta --require-format gfa --require-format fhp-fasta \
            --require-format fhgff3 --require-format jsonld --require-format microdata
          env -u PYTHONPATH "$checker_python" "$GITHUB_WORKSPACE/.policy-specification/scripts/reader_policy.py" --toolkit "$converter_bin/bioheaders"
