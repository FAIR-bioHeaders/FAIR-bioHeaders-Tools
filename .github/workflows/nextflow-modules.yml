name: Nextflow modules

# Tests the nf-core-style modules in nextflow/ with Docker. The modules pin the
# Bioconda package bioconda::fair-bioheaders=X.Y.Z and its BioContainers image
# quay.io/biocontainers/fair-bioheaders:X.Y.Z--<build>; this workflow checks that
# the two versions agree in each module, then runs nf-test, which pulls the image.
# The modules don't use the GHCR image any more; the dockerfile job still builds
# it from the Dockerfile and the pinned release's wheel and smoke-tests it, so
# Dockerfile changes are tested before a release publishes them (container.yml).

on:
  push:
    branches: [main]
    paths:
      - 'nextflow/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/nextflow-modules.yml'
  pull_request:
    paths:
      - 'nextflow/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - '.github/workflows/nextflow-modules.yml'

permissions:
  contents: read

jobs:
  nf-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that each module's container matches its Bioconda pin
        run: |
          for module in nextflow/modules/nf-core/fairbioheaders/*/; do
            version="$(sed -n 's/.*bioconda::fair-bioheaders=\([0-9.]*\)$/\1/p' "$module/environment.yml")"
            test -n "$version"
            grep -q "quay.io/biocontainers/fair-bioheaders:$version--" "$module/main.nf"
            grep -q "depot.galaxyproject.org/singularity/fair-bioheaders:$version--" "$module/main.nf"
          done
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1
        with:
          version: 26.04.6
      - uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2.1.0
        with:
          version: 0.9.5
      - name: Run nf-test
        working-directory: nextflow
        run: nf-test test --profile docker --ci --verbose

  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and smoke-test the image of the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*bioconda::fair-bioheaders=\([0-9.]*\)$/\1/p' \
            nextflow/modules/nf-core/fairbioheaders/combine/environment.yml)"
          test -n "$version"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern 'fair_bioheaders-*-py3-none-any.whl' --dir dist
          docker build --build-arg "VERSION=$version" --tag smoke-test .
          test "$(docker run --rm smoke-test bioheaders --version)" = "$version"
          docker run --rm -v "$PWD/examples:/data:ro" smoke-test bioheaders verify /data/example.fhr.fasta
