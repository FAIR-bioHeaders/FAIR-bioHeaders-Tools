name: Release

# Pushing a version tag (vX.Y.Z) builds, tests and publishes that version of two
# distributions: fair-bioheaders (the tools) and fhr (the old name, which only
# depends on the same fair-bioheaders version). Their wheels and sdists are
# attached to a GitHub release (which Zenodo archives) and published to PyPI
# through trusted publishing, with no stored token. The container image is then
# built from the released wheel (container.yml).

on:
  push:
    tags: ['v*.*.*']
  # Re-publish an existing release's files to PyPI, uploading only what PyPI is
  # missing. Use this when the pypi job failed after the GitHub release was made.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to PyPI (for example v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: python -m pip install poetry==2.3.2
      - name: Install build
        run: python -m pip install build==1.6.1
      - name: Check the tag matches both distribution versions
        run: |
          version="$(poetry version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match fair-bioheaders $version" >&2
            exit 1
          fi
          python - "$version" <<'EOF'
          import sys, tomllib
          version = sys.argv[1]
          with open("compat/fhr/pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]
          expected = (version, [f"fair-bioheaders=={version}"])
          if (project["version"], project["dependencies"]) != expected:
              sys.exit(f"compat/fhr must be version {version} and require only "
                       f"fair-bioheaders=={version}")
          EOF
      - name: Test
        run: |
          poetry install
          poetry run pytest
      - name: Build wheels and source distributions
        run: |
          poetry build
          python -m build compat/fhr --outdir dist
          ls dist
          test "$(ls dist | wc -l)" -eq 4
          sha256sum dist/*
      - name: Check the built wheels install and run outside the checkout
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/release-check/bin/bioheaders --version
          /tmp/release-check/bin/fhr-validate "$GITHUB_WORKSPACE/examples/minimal.fhr.json"
          /tmp/release-check/bin/fhr-fasta-validate "$GITHUB_WORKSPACE/examples/example.fhr.fasta"
          /tmp/release-check/bin/python -W error -c "import bioheaders"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry for $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "FAIR-bioHeaders Tools $GITHUB_REF_NAME" --notes-file notes.md

  container:
    # Builds and pushes the container image from the release's wheel; see
    # container.yml (GHCR always, Docker Hub when its secrets are set).
    needs: github-release
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uploads every file in dist/: both fair-bioheaders and fhr. Each PyPI project
    # needs a trusted publisher for this repository, workflow and environment.
    environment:
      name: pypi
      url: https://pypi.org/project/fair-bioheaders/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  pypi-existing-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/fair-bioheaders/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's wheels and sdists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.whl' --pattern '*.tar.gz' --dir dist
          ls dist
          test "$(ls dist | wc -l)" -eq 4
          sha256sum dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
