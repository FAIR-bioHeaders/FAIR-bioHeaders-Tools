name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Python 3.9 builds are available on 24.04, not the 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
      - name: Install samtools, bgzip and pysam for the faidx comparison tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools tabix
          poetry run pip install pysam
      - name: Check out the specification for the comparison tests
        # Pinned so specification changes cannot break this CI, and cloned outside the
        # workspace so the linters below do not see it. The bundled schemas are the
        # ones prepared for v0.5.0, so this is the specification commit that adds them,
        # by hash, until the v0.5.0 tag exists; then pin the tag again.
        run: |
          SPEC="$RUNNER_TEMP/FAIR-bioHeaders-Specification"
          git init --quiet "$SPEC"
          git -C "$SPEC" fetch --quiet --depth 1 https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification.git 9c805552e3a4ce57c2178f039c2eee47058dca28
          git -C "$SPEC" checkout --quiet FETCH_HEAD
      - name: Test installed commands and library
        env:
          FHR_REQUIRE_FAIDX_TOOLS: '1'
        run: FHR_SPECIFICATION="$RUNNER_TEMP/FAIR-bioHeaders-Specification" poetry run pytest
      - name: Lint and formatting
        run: |
          poetry run ruff check .
          poetry run isort . --check-only
          poetry run black . --check
      - name: Type check
        run: poetry run mypy -p bioheaders
      - name: Build wheels and source distributions
        run: |
          poetry build
          python -m pip install build
          python -m build compat/fhr --outdir dist
