name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Python 3.9 builds are available on 24.04, not the 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
          # Matrix integration tests exercise installed CLI artifacts outside the
          # checkout and verify their runtime/data bytes against this source.
          poetry run pip install --no-deps .
      - name: Install samtools, bgzip and pysam for the faidx comparison tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools tabix
          poetry run pip install pysam
      - name: Check out the specification for the comparison tests
        # Pinned to a release tag so specification changes cannot break this CI;
        # cloned outside the workspace so the linters below do not see it. The
        # bundled schemas are the released v0.7.0 copies (FHR 2.1, FHP 1.2,
        # FHGFF3 1.2 and FHT 1.0).
        # The older release tags are fetched too (each at depth 1), so the
        # bundled snapshots of every release are compared, not skipped.
        run: |
          git clone --quiet --depth 1 --branch v0.7.0 https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Specification.git "$RUNNER_TEMP/FAIR-bioHeaders-Specification"
          git -C "$RUNNER_TEMP/FAIR-bioHeaders-Specification" fetch --quiet --depth 1 origin '+refs/tags/*:refs/tags/*'
      - name: Test installed commands and library
        env:
          FHR_REQUIRE_FAIDX_TOOLS: '1'
          FHR_REQUIRE_SPECIFICATION: '1'
        # -rs lists every skip and its reason in the log.
        run: FHR_SPECIFICATION="$RUNNER_TEMP/FAIR-bioHeaders-Specification" poetry run pytest -rs
      - name: Lint and formatting
        run: |
          poetry run ruff check .
          poetry run isort . --check-only
          poetry run black . --check
      - name: Type check
        run: poetry run mypy -p bioheaders
      - name: Build wheels and source distributions
        run: |
          poetry build
          python -m pip install build
          python -m build compat/fhr --outdir dist

  fht-conformance:
    # The FHT draft acceptance suite at the revision pinned in
    # bioheaders/schemas/bundled.json (drafts.FHT.suite), with the opt-in draft
    # lane open. Draft evidence, not a released support claim; FHT_REQUIRE_SUITE
    # makes a missing checkout or closed lane fail instead of skipping.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
      - name: Check out FHT-Specification at the pinned suite revision
        run: |
          revision=$(python -c "import json; print(json.load(open('bioheaders/schemas/bundled.json'))['drafts']['FHT']['suite']['revision'])")
          git init --quiet "$RUNNER_TEMP/FHT-Specification"
          git -C "$RUNNER_TEMP/FHT-Specification" fetch --quiet --depth 1 https://github.com/FAIR-bioHeaders/FHT-Specification.git "$revision"
          git -C "$RUNNER_TEMP/FHT-Specification" checkout --quiet FETCH_HEAD
      - name: Run the FHT conformance vectors
        env:
          BIOHEADERS_EXPERIMENTAL_FHT: '1'
          FHT_REQUIRE_SUITE: '1'
        run: FHT_SPECIFICATION="$RUNNER_TEMP/FHT-Specification" poetry run pytest -rs tests/fht_conformance_test.py

  fhgm-conformance:
    # The FHGM development suite at the revision pinned in
    # bioheaders/schemas/bundled.json (drafts.FHGM.suite), scored through the opt-in
    # draft lane. Draft evidence, not a released support claim: FHGM has no
    # published contract, and FAIR-bioHeaders-Tools#135 stays open until it has one
    # and a release carries the evidence. FHGM_REQUIRE_SUITE makes a missing checkout
    # or a closed lane fail instead of skipping.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install
      - name: Check out FHGM-Specification at the pinned suite revision
        run: |
          revision=$(python -c "import json; print(json.load(open('bioheaders/schemas/bundled.json'))['drafts']['FHGM']['suite']['revision'])")
          git init --quiet "$RUNNER_TEMP/FHGM-Specification"
          git -C "$RUNNER_TEMP/FHGM-Specification" fetch --quiet --depth 1 https://github.com/FAIR-bioHeaders/FHGM-Specification.git "$revision"
          git -C "$RUNNER_TEMP/FHGM-Specification" checkout --quiet FETCH_HEAD
      - name: Run the FHGM conformance vectors
        env:
          BIOHEADERS_EXPERIMENTAL_FHGM: '1'
          FHGM_REQUIRE_SUITE: '1'
        run: FHGM_SPECIFICATION="$RUNNER_TEMP/FHGM-Specification" poetry run pytest -rs tests/fhgm_conformance_test.py
