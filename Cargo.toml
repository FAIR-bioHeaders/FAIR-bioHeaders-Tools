[workspace]
resolver = "3"
members = [
    "crates/fair-bioheaders-tools",
    "crates/fair-bioheaders-tools-bundles",
]
default-members = [
    "crates/fair-bioheaders-tools",
    "crates/fair-bioheaders-tools-bundles",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
authors = ["FAIR-bioHeaders contributors"]

[workspace.dependencies]
fair-bioheaders-tools = { path = "crates/fair-bioheaders-tools", version = "0.1.0-dev" }
fair-bioheaders-tools-bundles = { path = "crates/fair-bioheaders-tools-bundles", version = "0.1.0-dev" }
saphyr-parser = { version = "0.4.1", default-features = false }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std", "arbitrary_precision", "preserve_order"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
jsonschema = { version = "0.63.2", default-features = false, features = ["arbitrary-precision"] }
regress = { version = "0.12", default-features = false, features = ["std", "backend-pikevm"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
data-encoding = { version = "2", default-features = false, features = ["std"] }
pyo3 = { version = "0.30", default-features = false, features = ["macros", "extension-module", "abi3-py39"] }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
