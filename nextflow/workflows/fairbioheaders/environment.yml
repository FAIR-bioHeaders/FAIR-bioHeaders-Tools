---
# Conda environment of the workflow's conda profile: the modules' Bioconda package,
# which since 0.8.2 includes pyld, the optional dependency (the jsonld extra) that
# reading JSON-LD in other than the canonical form needs. Keep the pin equal to the
# modules' pins.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::fair-bioheaders=0.8.2
