---
# Conda environment of the workflow's conda profile: the modules' Bioconda package
# plus pyld, the optional dependency (the jsonld extra) that reading JSON-LD in other
# than the canonical form needs; the Bioconda package does not include it.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::fair-bioheaders=0.8.1
  - conda-forge::pyld>=3.3,<4
