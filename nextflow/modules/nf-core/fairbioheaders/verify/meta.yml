# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "fairbioheaders_verify"
description: Verify the FAIR-bioHeaders (FHR) header of a FASTA or GFA file, validating it
  against the FHR schema and checking that its SHA-512/256 checksum matches the file
keywords:
  - fasta
  - gfa
  - metadata
  - provenance
  - fair
  - checksum
tools:
  - "fair-bioheaders":
      description: "FAIR-bioHeaders Tools: validate, convert, combine and strip FAIR-bioHeaders
        (FHR) provenance metadata embedded in FASTA and GFA headers"
      homepage: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      documentation: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools#readme"
      tool_dev_url: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      doi: "10.1093/bib/bbae122"
      licence: ["MPL-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
    - sequence:
        type: file
        description: FASTA or GFA file with an FHR header, plain or gzip/BGZF-compressed
        pattern: "*.{fa,fasta,fna,fas,gfa}{,.gz,.bgz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3975 # GFA 1
output:
  report:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*.verify.txt":
          type: file
          description: Text report naming the file and the result. The task fails when the
            header is invalid or the checksum does not match
          pattern: "*.verify.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330 # Textual format
  versions_fairbioheaders:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@adamjohnwright"
maintainers:
  - "@adamjohnwright"
  - "@molikd"
