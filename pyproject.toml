[tool.flake8]
max-line-length = 120
ignore = "E203, E266, E501, W503"

[tool.poetry]
name = "fair-bioheaders"
version = "0.8.1"
description = "Convert and validate FAIR-bioHeaders (FHR) metadata in JSON, YAML, FASTA, GFA, and HTML (formerly the fhr package)"
authors = ["David Molik <molik@fhref.org>","Adam Wright <wright@fhref.org>"]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
repository = "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
documentation = "https://github.com/FAIR-bioHeaders/FHR-Specification"
keywords = ["FAIR", "FHR", "genome", "metadata", "fasta", "gfa"]
# bioheaders is the package; the fhr.py module is its deprecated alias, kept for
# old imports. The fhr/ directory holds checkout-only files and is not installed.
packages = [{include = "bioheaders"}, {include = "fhr.py"}]
include = ["bioheaders/schemas/*.json", "bioheaders/fhr_schema.json", "bioheaders/fhp_schema.json", "bioheaders/fhgff3_schema.json", "bioheaders/fhr.context.jsonld", "bioheaders/assess/data/**/*.json"]

[tool.poetry.dependencies]
python = "^3.9"
jsonschema = {version = "^4.21.1", extras = ["format"]}
pyyaml = "^6.0.1"
# Optional: reading JSON-LD that is not in the canonical form (rules J3 to J6).
pyld = {version = "^3.3", optional = true, python = ">=3.10"}

[tool.poetry.extras]
jsonld = ["pyld"]

[tool.poetry.group.dev.dependencies]
mypy = "^1.8.0"
types-pyyaml = "^6.0.12.12"
types-jsonschema = "^4.21.0.20240118"
isort = "^5.13.2"
black = [
    { version = "^26.3.1", python = ">=3.10" },
    { version = ">=24.3.0,<26", python = "<3.10" },
]
ruff = "^0.2.1"
# pytest 9.0.3 fixes CVE-2025-71176 but needs Python 3.10; 8.4 is the newest for 3.9.
pytest = [
    { version = "^9.0.3", python = ">=3.10" },
    { version = "^8.4.2", python = "<3.10" },
]
pyld = {version = "^3.3", python = ">=3.10"}

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools/issues"
"Changelog" = "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools/blob/main/CHANGELOG.md"

[tool.poetry.scripts]
bioheaders = "bioheaders.cli:main"
# The fhr-* commands predate bioheaders and are kept unchanged.
fhr-convert = "bioheaders.cli:convert_main"
fhr-validate = "bioheaders.cli:validate_main"
fhr-fasta-strip = "bioheaders.cli:fasta_strip_main"
fhr-fasta-combine = "bioheaders.cli:fasta_combine_main"
fhr-fasta-validate = "bioheaders.cli:fasta_validate_main"
fhr-gfa-strip = "bioheaders.cli:gfa_strip_main"
fhr-gfa-combine = "bioheaders.cli:gfa_combine_main"
fhr-gfa-validate = "bioheaders.cli:gfa_validate_main"
fhr-gff3-strip = "bioheaders.cli:gff3_strip_main"
fhr-gff3-combine = "bioheaders.cli:gff3_combine_main"
fhr-gff3-validate = "bioheaders.cli:gff3_validate_main"



[build-system]
requires = ["poetry-core>=1.8,<3"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py39"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
